[package]
name = "poro"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "poro"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
unicode-segmentation = "1"
ring = "0.17"
blake3 = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# GPUI 0.2.2 with Neo's idle-CPU patch (see vendor/gpui/NEO-PATCH.md).
gpui = { path = "vendor/gpui" }
